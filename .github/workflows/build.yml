name: build
on:
  push:
  workflow_dispatch:
jobs:
  b:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Zygisk lib and repack
        run: |
          Z=$(ls FlagshipKit*.zip | head -n1)
          echo "Using $Z"
          unzip -q "$Z" -d mod
          curl -fsSL -o mod/zygisk-src/zygisk.hpp https://raw.githubusercontent.com/topjohnwu/zygisk-module-sample/master/module/jni/zygisk.hpp
          cmake -S mod/zygisk-src -B out -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DCMAKE_BUILD_TYPE=Release
          cmake --build out
          mkdir -p mod/zygisk
          cp out/libflagship_kit.so mod/zygisk/arm64-v8a.so
          rm -rf mod/zygisk-src
          cd mod && zip -rq ../FlagshipKit_v2_zygisk.zip .
      - uses: actions/upload-artifact@v4
        with:
          name: FlagshipKit_v2_zygisk
          path: FlagshipKit_v2_zygisk.zip
